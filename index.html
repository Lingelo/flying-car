<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flying Car — Neon City</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }

      /* Loading screen: plain HTML and CSS so it shows before the game bundle has loaded. */
      #loading {
        position: fixed; inset: 0; z-index: 50; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(#07021a 0%, #1a0533 45%, #3a0a4a 62%, #07021a 62.2%);
        font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
        color: #e8f6ff; transition: opacity 0.9s ease; pointer-events: none; user-select: none;
      }
      #loading.done { opacity: 0; }
      #loading .sun {
        position: absolute; left: 50%; top: 62%; width: min(56vmin, 520px); aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: linear-gradient(#ffe36e 0%, #ff9f3d 35%, #ff3d8b 70%, #b32bd6 100%);
        box-shadow: 0 0 80px 20px rgba(255, 61, 139, 0.45);
        /* Horizontal slits in the lower part of the visible half, thicker towards the horizon. */
        -webkit-mask: linear-gradient(#000 0 27%, transparent 27% 29%, #000 29% 34%, transparent 34% 37%, #000 37% 41%, transparent 41% 45%, #000 45% 47%, transparent 47%);
        mask: linear-gradient(#000 0 27%, transparent 27% 29%, #000 29% 34%, transparent 34% 37%, #000 37% 41%, transparent 41% 45%, #000 45% 47%, transparent 47%);
        clip-path: inset(0 0 50% 0);
      }
      #loading .grid {
        position: absolute; left: -50%; right: -50%; top: 62%; height: 80%;
        background:
          linear-gradient(transparent 0 92%, rgba(255, 61, 139, 0.9) 92%) 0 0 / 100% 48px,
          linear-gradient(90deg, transparent 0 96%, rgba(127, 246, 255, 0.75) 96%) 0 0 / 64px 100%;
        transform-origin: top; transform: perspective(260px) rotateX(62deg);
        animation: grid-run 1.1s linear infinite;
        -webkit-mask: linear-gradient(transparent, #000 25%);
        mask: linear-gradient(transparent, #000 25%);
      }
      @keyframes grid-run { to { background-position: 0 48px, 0 0; } }
      #loading .logo { position: relative; text-align: center; transform: translateY(-14vh); }
      #loading .neon {
        margin: 0; line-height: 0.9; font-family: 'Arial Black', 'Helvetica Neue', Impact, sans-serif;
        font-size: clamp(54px, 13vw, 168px); font-weight: 900; font-style: italic; letter-spacing: 0.02em;
        background: linear-gradient(#ffffff 0%, #bfe9ff 38%, #1d2a6b 50%, #ff7ad9 51%, #ffe3f7 72%, #ffffff 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.55);
        filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 14px #ff3d8b) drop-shadow(0 0 34px #a77bff);
        transform: skewX(-8deg);
      }
      #loading .script {
        margin: -0.35em 0 0 0.6em; font-family: 'Brush Script MT', 'Segoe Script', 'Lucida Handwriting', cursive;
        font-size: clamp(34px, 6vw, 76px); color: #ff3d8b; transform: rotate(-7deg);
        text-shadow: 0 0 4px #fff, 0 0 12px #ff3d8b, 0 0 28px #ff3d8b, 0 0 48px #b32bd6;
        animation: flicker 4s infinite;
      }
      @keyframes flicker { 0%, 18%, 22%, 62%, 64%, 100% { opacity: 1; } 20%, 63% { opacity: 0.35; } }
      #loading .tag { margin-top: 18px; font-size: 13px; letter-spacing: 0.5em; color: #7ff6ff; text-shadow: 0 0 8px #7ff6ff; }
      #loading .progress { position: absolute; bottom: 9vh; width: min(420px, 70vw); text-align: center; }
      #loading .bar { height: 6px; border: 1px solid rgba(127, 246, 255, 0.5); box-shadow: 0 0 12px rgba(127, 246, 255, 0.35); }
      #loading .fill {
        height: 100%; width: 0%; transition: width 0.4s ease;
        background: linear-gradient(90deg, #7ff6ff, #a77bff, #ff3d8b); box-shadow: 0 0 10px #ff3d8b;
      }
      #loading .status { margin-top: 10px; font-size: 12px; letter-spacing: 0.3em; color: rgba(232, 246, 255, 0.7); text-transform: uppercase; }
      @media (prefers-reduced-motion: reduce) { #loading .grid, #loading .script { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading" role="status" aria-live="polite">
      <div class="sun"></div>
      <div class="grid"></div>
      <div class="logo">
        <h1 class="neon">NEON CITY</h1>
        <div class="script">Flying Car</div>
        <div class="tag">東京 · 2087 · TOKYO</div>
      </div>
      <div class="progress">
        <div class="bar"><div class="fill" data-fill></div></div>
        <div class="status" data-status>Démarrage…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
